name: Generate Snake

on:
  # Roda a cada 24 horas automaticamente
  schedule:
    - cron: "0 */24 * * *"
  
  # Permite você rodar manualmente na aba Actions
  workflow_dispatch:
  
  # Roda sempre que você fizer push na main
  push:
    branches:
    - main
    
jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Gera os arquivos da cobrinha (Dark e Light)
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            
      # Envia os arquivos para a branch "output" para não poluir sua main
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
